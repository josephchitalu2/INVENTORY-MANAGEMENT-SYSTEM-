<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store IMS · Account</title><style>body{font:16px system-ui;background:#101713;color:#e7eee9;max-width:540px;margin:7vh auto;padding:24px}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;margin-top:6px}button{background:#c5ee92;border:0;border-radius:8px;cursor:pointer}a{color:#c5ee92}.message{color:#ffd69a}</style><a href="/">← Inventory</a><h1>Account</h1>{% if message %}<p class="message" role="status">{{ message }}</p>{% endif %}<h2>Change password</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Current password<input type="password" name="current" required autocomplete="current-password"></label><label>New password (at least 8 characters)<input type="password" name="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><button>Change password &amp; sign out</button></form>{% if user and user.role == 'admin' %}<h2>Create staff account</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="action" value="create_user"><label>Username<input name="username" maxlength="50" autocomplete="off" required></label><label>Password<input type="password" name="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><label>Role<select name="role"><option value="staff">Staff: record stock movements</option><option value="manager">Manager: also add and edit products</option><option value="admin">Admin: also manage accounts and backups</option></select></label><button>Create account</button></form>{% endif %}</html>
