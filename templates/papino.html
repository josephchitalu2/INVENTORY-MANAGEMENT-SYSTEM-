<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAPINO · Store desk</title><style>
:root{font:15px system-ui;color:#dce5f4;background:#10141e;--panel:#1b2232;--line:#303b51;--muted:#9caec9;--blue:#6d9fff;--green:#8ed9ad}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:10px;background:#121a29;color:inherit}button,a{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.5}a{color:#a4c3ff}header{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}header small{display:block;color:var(--muted);margin-top:4px}.brand{font-weight:800;letter-spacing:2px}.badge{color:var(--green);font-size:12px}nav{display:flex;gap:8px;padding:16px 28px;flex-wrap:wrap}nav button.active,.primary{background:#315fb4;color:white;border-color:#557ac3}main{padding:8px 28px 30px;max-width:1600px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}p,small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;max-height:60vh;overflow:auto}.product{text-align:left;min-height:104px;background:#222c40}.product small{display:block;margin-top:10px}.price{color:var(--green);font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.scroll{overflow:auto}.total{font-size:32px;font-weight:750;color:#fff}.muted{color:var(--muted)}#notice{padding:12px 18px;background:#203654;border:1px solid #385988;border-radius:8px;margin-bottom:18px}#notice:empty{display:none}.error{color:#ffb7b7}label{display:block;margin:12px 0;color:var(--muted);font-size:13px}label input,label select,label textarea{display:block;width:100%;margin-top:6px;color:#dce5f4}dialog{background:var(--panel);color:#dce5f4;border:1px solid #526588;border-radius:12px;width:min(760px,94vw);max-height:90vh;padding:24px}dialog::backdrop{background:#060a14d9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.tile{display:inline-block;padding:16px;margin:5px;background:#232f46;border-radius:8px}.amount{font-size:21px;font-weight:700}footer{font-size:12px;color:var(--muted);padding:18px 28px;border-top:1px solid var(--line)}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}header,main,nav{padding:14px}.wide{grid-column:auto}}
</style></head><body><header><div><div class="brand">PAPINO <span class="badge">● LOCAL STORE</span></div><small>Investments Limited · Point of sale & inventory</small></div><div>{{ user.username }} · {{ user.role }}<small><a href="/account">Account & staff</a> · {% if user.role == 'admin' %}<a href="/backup">Backup</a>{% endif %}</small><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button>Sign out</button></form></div></header><nav id="nav"></nav><main><div id="notice" role="status" aria-live="polite"></div><div id="screen"></div></main><footer>Chitalu Software Solutions · Offline on this PC · Times shown in Africa/Lusaka · Copy a database backup to another drive daily.</footer>
<dialog id="modal"><form id="form"><h2 id="dialog-title"></h2><div id="fields" class="grid"></div><div id="dialog-error" role="alert" class="error"></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="submit">Save</button></div></form></dialog>
<script>
'use strict';
const csrf={{ session.csrf|tojson }}, user={{ {'id':user.id,'role':user.role,'username':user.username}|tojson }}, owner=user.role!=='staff';
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'K '+(Number(n)/100).toFixed(2), key=()=>crypto.randomUUID();
let state=null,view='Sell',basket=[],pendingKey=key(),busy=false,formCallback=null,search='';
const draftKey='papino-basket-'+user.id;
try{let d=JSON.parse(localStorage.getItem(draftKey));if(d){basket=d.basket||[];pendingKey=d.key||key();}}catch{}
function saveDraft(){try{localStorage.setItem(draftKey,JSON.stringify({basket,key:pendingKey}));}catch{notice('Draft storage unavailable. Keep this page open until checkout completes.');}}
function notice(t){$('notice').textContent=t;}
async function refresh(){const r=await fetch('/api/pos');if(r.status===401){location='/login';return;}if(!r.ok)throw Error('Cannot load store records.');state=await r.json();render();}
async function act(action,data){if(busy)throw Error('Wait for the current operation.');busy=true;$('submit').disabled=true;try{let r=await fetch('/api/pos',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({action,data})});let result;try{result=await r.json();}catch{throw Error('Request failed. Reload and check records before retrying.');}if(!r.ok)throw Error(result.error||'Operation rejected.');await refresh();return result;}finally{busy=false;$('submit').disabled=false;}}
function current(){return state.shifts.find(s=>s.status!=='closed');}function ownOpen(){const s=current();return s&&s.user_id===user.id&&s.status==='open';}
function table(heads,rows){return `<div class="scroll"><table><thead><tr>${heads.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead><tbody>${rows.join('')||'<tr><td>No records yet.</td></tr>'}</tbody></table></div>`;}
function btn(label,fn){return `<button onclick="${fn}">${esc(label)}</button>`;}
function field(name,label,type='text',value='',required=true){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'step="any" min="0"':''} maxlength="500"></label>`;}
function select(name,label,options){return `<label>${esc(label)}<select name="${name}">${options.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></label>`;}
function dialog(title,fields,callback){$('dialog-title').textContent=title;$('fields').innerHTML=fields;$('dialog-error').textContent='';formCallback=callback;$('modal').showModal();}
$('cancel').onclick=()=>$('modal').close();$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;try{await formCallback(Object.fromEntries(new FormData(e.target)));$('modal').close();notice('Saved on this PC.');}catch(err){$('dialog-error').textContent=err.message;}};
function render(){if(!state)return;$('nav').innerHTML=['Sell','Shifts','Credit & receipts','Cash movements','Stock','Owner review'].filter(v=>owner||v!=='Owner review').map(v=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${v}</button>`).join('');if(view==='Sell')sell();if(view==='Shifts')shifts();if(view==='Credit & receipts')sales();if(view==='Cash movements')cashScreen();if(view==='Stock')stock();if(view==='Owner review')review();}
function sell(){let s=current();$('screen').innerHTML=`<h1>Serve the next customer.</h1><p>${s?'Shift #'+s.id+' · '+esc(s.username)+' · '+s.status:'Open a shift before selling.'}</p><div class="layout"><section class="panel"><h2>Products</h2><div class="toolbar"><input id="search" aria-label="Search or scan barcode" placeholder="Search a product or scan barcode" value="${esc(search)}"></div><div class="products" id="products"></div></section><section class="panel"><h2>Current basket</h2><div id="cart"></div><div class="toolbar">${btn('Clear basket',"clearBasket()")}${btn('Take payment',"checkout()")}</div><small>The server checks prices and stock at checkout. Scanning accepts a barcode followed by Enter.</small></section></div>`;$('search').oninput=e=>{search=e.target.value;products();};$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();let i=state.items.find(i=>i.barcode===e.target.value);if(i)add(i.id);else notice('Barcode not found. Search by product name.');}};products();cart();}
function products(){const q=search.toLowerCase();$('products').innerHTML=state.items.filter(i=>(i.name+' '+i.category+' '+i.barcode).toLowerCase().includes(q)).map(i=>`<button class="product" onclick="add(${i.id})"><strong>${esc(i.name)}</strong><small>${Number(i.quantity).toFixed(3)} ${esc(i.unit_type)} available</small><span class="price">${money(Math.round(i.selling_price*100))} / ${esc(i.name==='Game meat (bundle)'?'bundle':i.unit_type)}</span></button>`).join('')||'<p>No matching products. Owner: prepare the catalog in Stock.</p>';}
function add(id){if(!ownOpen()){notice('Your shift must be open to build a sale.');return;}let i=state.items.find(i=>i.id===id);dialog('Add '+i.name,field('quantity','Quantity ('+i.unit_type+')','number',i.unit_type==='kg'?'0.5':'1'),async d=>{let n=Number(d.quantity);if(!Number.isFinite(n)||n<=0)throw Error('Enter a positive quantity.');let row=basket.find(x=>x.id===id);if(row)row.quantity=Number(row.quantity)+n;else basket.push({id,quantity:n});pendingKey=key();saveDraft();render();});}
function cart(){let total=0;$('cart').innerHTML=table(['Product','Quantity','Amount',''],basket.map((r,n)=>{let i=state.items.find(i=>i.id===r.id);let amount=Math.round((i?.selling_price||0)*100*Number(r.quantity));total+=amount;return `<tr><td>${esc(i?.name||'Unavailable product')}</td><td>${esc(r.quantity)}</td><td>${money(amount)}</td><td>${btn('Remove',`removeLine(${n})`)}</td></tr>`}))+`<p>Total estimate</p><div class="total">${money(total)}</div>`;}
function removeLine(n){basket.splice(n,1);pendingKey=key();saveDraft();render();}function clearBasket(){if(confirm('Clear the unfinished basket?')){basket=[];pendingKey=key();saveDraft();render();}}
function payFields(){return field('cash','Cash allocated (K)','number','0')+field('tendered','Cash received (K), before change','number','0')+field('zanaco','Zanaco allocated (K)','number','0')+field('zanaco_ref','Zanaco terminal reference','text','',false)+field('airtel','Airtel allocated (K)','number','0')+field('airtel_ref','Airtel reference — cashier recorded','text','',false);}
function paymentRows(d){return ['cash','zanaco','airtel'].filter(m=>Number(d[m])>0).map(method=>({method,amount:d[method],reference:d[method+'_ref']||''}));}
function checkout(){if(!ownOpen()||!basket.length){notice('Open your shift and add products first.');return;}dialog('Payment · unpaid balance becomes credit',payFields()+`<p class="wide muted">For credit, all customer and owner-authorization fields below are required. A card/Airtel entry records your declaration, not automatic bank confirmation.</p>`+field('customer','Customer / debtor','text','',false)+field('contact','Customer contact','text','',false)+field('recipient','Person receiving goods','text','',false)+field('due','Agreed payment date','date','',false)+field('authorization','Dad’s authorization: name, phone approval details','text','',false),async d=>{let result=await act('checkout',{...d,key:pendingKey,items:basket,payments:paymentRows(d)});basket=[];pendingKey=key();saveDraft();render();window.open('/receipt/'+result.sale_id,'_blank');});}
function shifts(){let s=current();$('screen').innerHTML=`<h1>Shift control</h1><p>Normal opening float: K500. First closing count is preserved.</p><section class="panel"><h2>${s?'Shift #'+s.id+' · '+esc(s.username)+' · '+s.status:'No active shift'}</h2><div class="toolbar">${!s?btn('Open shift','openShift()'):''}${s?.user_id===user.id&&s.status==='open'?btn('Start closing','startClose()'):''}${s?.user_id===user.id&&s.status==='closing'?btn('Submit blind count','countCash()'):''}${s?.user_id===user.id&&s.status==='counted'?btn('Record recount','countCash(true)')+btn('Finish close / retain float','finishClose()'):''}</div>${s?.status==='counted'?`<div class="tile">Counted <div class="amount">${money(s.counted)}</div></div><div class="tile">Expected at count <div class="amount">${money(s.expected)}</div></div><div class="tile">Difference <div class="amount">${money(s.counted-s.expected)}</div></div><p>Latest count: ${money(s.latest_count?.amount??s.counted)}. All original counts remain in history. Record any closing owner deposit under Cash movements, then enter actual remaining float.</p>`:''}${s?.status==='closing'?'<p>Checkout is paused. Enter the physical notes and coins before seeing the expected balance.</p>':''}</section><section class="panel">${table(['Shift','Cashier','Opened','Close started','Count submitted','Finished','Difference','Review'],state.shifts.map(x=>`<tr><td>#${x.id} · ${x.status}</td><td>${esc(x.username)}</td><td>${esc(x.opened)}</td><td>${esc(x.close_started)}</td><td>${esc(x.counted_at)}</td><td>${esc(x.closed)}</td><td>${x.counted==null?'—':money(x.counted-x.expected)}</td><td>${x.reviewed_by?'Owner reviewed':'Pending'}</td></tr>`))}</section>`;}
function openShift(){dialog('Open your shift',field('opening','Physical opening float (K)','number','500')+field('explanation','Explain if different from K500','text','',false),d=>act('open',d));}
function startClose(){dialog('Pause trading and start closing','<p class="wide">Count in the camera-covered area. Checkout will pause until closing finishes.</p>',()=>act('start_close',{}));}
function countCash(recount=false){const den=[50000,20000,10000,5000,2000,1000,500,200,100,50,10,5];dialog(recount?'Record a reasoned recount':'Blind physical cash count',den.map(n=>field('n'+n,money(n)+' · number of notes/coins','number','0')).join('')+field('explanation','Notes about the first count','text','',false),d=>act(recount?'recount':'count',{denominations:Object.fromEntries(den.map(n=>[String(n),Number(d['n'+n])])),explanation:d.explanation}));}
function finishClose(){dialog('Finish shift',field('remaining','Actual cash remaining in till (K)','number','500')+field('explanation','Explain shortage/surplus or different float','text','',false),d=>act('finish_close',d));}
function sales(){$('screen').innerHTML=`<h1>Credit & receipts</h1><p>Repayment settles the original sale; it never deducts stock twice. Sale history and outstanding balances are retained.</p><section class="panel">${table(['Receipt','Date','Customer','Sale total','Owed','Actions'],state.sales.map(s=>`<tr><td>${esc(s.id)}${s.reversed?' · REVERSED':''}</td><td>${esc(s.created)}</td><td>${esc(s.customer||'Walk-in')}<small>${esc(s.contact)} · Due ${esc(s.due)}</small></td><td>${money(s.total)}</td><td>${money(s.balance)}</td><td><a target="_blank" href="/receipt/${s.id}">Receipt</a> ${s.balance>0?btn('Repay',`repay('${s.id}')`):''}${owner&&s.customer&&!s.credit_reviewed?btn('Verify credit',`reviewCredit('${s.id}')`):''}${owner&&!s.reversed?btn('Full reversal',`refund('${s.id}')`):''}</td></tr>`))}</section>`;}
function reviewCredit(id){dialog('Owner verifies credit authorization',field('details','Approval verification details'),d=>act('review_credit',{...d,sale_id:id}));}
function repay(id){const k=key();dialog('Repayment · '+id,payFields(),d=>act('repay',{...d,sale_id:id,key:k,payments:paymentRows(d)}));}
function refund(id){const k=key();dialog('Owner full-sale reversal',payFields()+field('reason','Reason and authorization')+select('restock','Returned goods safe to put back into original stock?',[['no','No — do not restock'],['yes','Yes — restock every original line']])+`<p class="wide">Enter exactly the amount actually received, including any later repayments. External refund references must be new. This reverses the whole sale; partial returns are not supported.</p>`,d=>act('refund',{...d,sale_id:id,key:k,payments:paymentRows(d),restock:d.restock==='yes'}));}
function cashScreen(){$('screen').innerHTML=`<h1>Cash movements</h1><p>Owner deposits deduct till cash once. Dad’s confirmation records receipt without deducting again.</p><div class="toolbar">${btn('Record expense / deposit','cashMove()')}${btn('Log payment dispute','exception()')}</div><section class="panel">${table(['Time','Kind','Till change','Details / reference','Review'],state.cash.map(r=>`<tr><td>${esc(r.created)}</td><td>${esc(r.kind)}</td><td>${money(r.amount)}</td><td>${esc(r.details)}<br>${esc(r.reference)}</td><td>${r.confirmed_by?'Reviewed':'Pending owner review'}</td></tr>`))}<p>Movement totals are hidden from cashier accounts until the blind count is submitted.</p></section>`;}
function cashMove(){const k=key();dialog('Till movement',select('kind','Movement',[['expense','Expense paid from till'],['owner_deposit','Cash collected → company Airtel via agent'],...(owner?[['cash_added','Owner cash added'],['cash_returned','Failed handover cash returned']]:[])])+field('amount','Amount (K)','number')+field('details','Purpose / Dad’s request')+select('category','Expense category',[['transport','Fish transport'],['sawdust','Sawdust'],['lunch','Lunch (routine)'],['plastics','Plastics (routine)'],['other','Other']])+field('recipient','Payee / agent name')+field('authorization','Owner phone approval details (required except lunch/plastics)','text','',false)+field('reference','Agent transaction reference (required for owner deposit)','text','',false),d=>act('cash',{...d,key:k}));}
function exception(){dialog('Payment exception — goods not released',select('method','Method',[['zanaco','Zanaco'],['airtel','Airtel']])+field('amount','Disputed amount (K)','number')+field('reference','Terminal / transaction reference')+field('details','What each side showed and follow-up required')+'<p class="wide">This records an incident only. If Dad releases goods while payment is disputed, use an authorized credit sale linked to this reference.</p>',d=>act('exception',{...d,goods_handed_over:false}));}
function stock(){$('screen').innerHTML=`<h1>Inventory</h1><p>Sales use selling prices. Set actual cost prices and opening quantities after a physical count.</p><div class="toolbar"><a href="/inventory">Open inventory editor / deliveries</a>${owner?btn('Prepare PAPINO catalog','catalog()')+btn('Ma dawari / stock withdrawal','withdraw()')+btn('Assign barcode','barcode()'):''}</div><section class="panel">${table(['Product','Category','Quantity','Selling price','Barcode'],state.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td>${esc(i.quantity)} ${esc(i.unit_type)}</td><td>${money(Math.round(i.selling_price*100))}</td><td>${esc(i.barcode)}</td></tr>`))}</section>`;}
function catalog(){dialog('Prepare catalog','<p>Creates the six agreed products at zero stock. Existing products are preserved. Game meat bundles use the whole-pack stock unit.</p>',()=>act('catalog',{}));}
function itemSelect(){return select('item_id','Product',state.items.map(i=>[i.id,i.name]));}
function withdraw(){const k=key();dialog('Owner stock reclassification',itemSelect()+field('quantity','Quantity','number')+select('mode','Reason',[['dawari','Ma dawari — suitable to eat, discounted stock'],['disposal','Disposal — unsuitable for consumption'],['staff_use','Staff consumption'],['gift','Authorized gift']])+field('price','Approved ma dawari selling price per unit (K)','number','0')+field('reason','Reason / authorization'),d=>act('withdraw',{...d,key:k}));}
function barcode(){dialog('Assign barcode',itemSelect()+field('barcode','Barcode text'),d=>act('barcode',d));}
function review(){let deposits=state.cash.filter(r=>!r.confirmed_by&&['expense','owner_deposit','cash_added','cash_returned'].includes(r.kind));let electronic=state.payments.filter(r=>r.method!=='cash'&&!r.reviewed_by);$('screen').innerHTML=`<h1>Owner review</h1><a href="/report.csv">Download full event report (CSV)</a><p>Cashier declarations stay separate from owner verification. Category totals below cover retained completed sales, before repayments.</p><section class="panel"><h2>Cash & deposits awaiting review</h2>${table(['ID / shift','Kind','Amount','Details',''],deposits.map(r=>`<tr><td>${r.id} / ${r.shift_id}</td><td>${r.kind}</td><td>${money(r.amount)}</td><td>${esc(r.details)} · ${esc(r.reference)}</td><td>${btn('Confirm/review',`confirmCash(${r.id})`)}</td></tr>`))}</section><section class="panel"><h2>Electronic payments</h2>${table(['ID','Method','Amount','Reference',''],electronic.map(r=>`<tr><td>${r.id}</td><td>${r.method}</td><td>${money(r.amount)}</td><td>${esc(r.reference)}</td><td>${btn('Reconcile',`confirmPayment(${r.id})`)}</td></tr>`))}</section><section class="panel"><h2>Shift reconciliation</h2>${table(['Shift','Cashier','Difference',''],state.shifts.filter(s=>s.status==='closed'&&!s.reviewed_by).map(s=>`<tr><td>${s.id}</td><td>${esc(s.username)}</td><td>${money(s.counted-s.expected)}</td><td>${btn('Owner review',`reviewShift(${s.id})`)}</td></tr>`))}</section><section class="panel"><h2>Shift totals / payment methods</h2>${table(['Shift','Sales','Receipts by method','Till movements'],state.shifts.map(s=>`<tr><td>#${s.id}</td><td>${money(s.sales_total||0)}</td><td>${Object.entries(s.payment_totals||{}).map(([k,v])=>esc(k)+': '+money(v)).join('<br>')}</td><td>${Object.entries(s.cash_totals||{}).map(([k,v])=>esc(k)+': '+money(v)).join('<br>')}</td></tr>`))}</section><section class="panel"><h2>Sales by category (all time)</h2>${table(['Category','Gross completed sales'],state.categories.map(c=>`<tr><td>${esc(c.category)}</td><td>${money(c.total)}</td></tr>`))}</section><section class="panel"><h2>Event trail · latest 300</h2>${table(['Time','Actor','Event','Details'],state.events.map(e=>`<tr><td>${esc(e.created)}</td><td>${e.user_id}</td><td>${esc(e.kind)}</td><td>${esc(e.details)}${e.kind==='payment_exception'?btn('Record resolution',`resolveException(${e.id})`):''}</td></tr>`))}</section>`;}
function confirmCash(id){dialog('Owner confirms actual receipt / expense review',field('details','Amount received or expense review notes'),d=>act('confirm_cash',{...d,id}));}function confirmPayment(id){dialog('Verify against company account / terminal',field('details','Verification details'),d=>act('confirm_payment',{...d,id}));}function reviewShift(id){dialog('Owner shift review',field('details','Review findings / variance explanation'),d=>act('review_shift',{...d,id}));}function resolveException(id){dialog('Resolve payment exception',field('details','Verified outcome and linked receipt/payment references'),d=>act('resolve_exception',{...d,id}));}
refresh().catch(e=>notice(e.message));
</script></body></html>
